name: CodeQL

# Manual only for now: a Swift CodeQL build takes a long time on macOS runners.
# Run it from the Actions tab (CodeQL, "Run workflow") before a release.
on:
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Security scan (Swift)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use the newest Xcode
        run: ./scripts/select-xcode.sh
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: swift
