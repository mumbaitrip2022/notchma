name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths: ['Sources/**', 'Package.swift']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Security scan (Swift)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: ./scripts/select-xcode.sh
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@v3
        with:
          category: swift
