name: CodeQL

# Manual only for now: a Swift CodeQL build takes a long time on macOS runners.
# Run it from the Actions tab (CodeQL, "Run workflow") before a release.
on:
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Security scan (Swift)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest Xcode
        run: ./scripts/select-xcode.sh
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: swift build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: swift
