name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          echo "Using $XCODE"
          swift --version

      - name: House style (no em or en dashes in app text)
        run: ./scripts/check-copy.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Universal release build
        run: swift build -c release --arch arm64 --arch x86_64
