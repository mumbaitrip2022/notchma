name: CI

# The shape, left to right (this is also what the notch draws, one dot per stage):
#
#   Checks ×6 (Linux, seconds)  ──▶  Test ×3 (macOS 15, 26, 27)  ───────────────────────────────────┐
#   What changed · Lint · Secrets     Package (Apple silicon app) ──▶ Size budget ───────────────────┼──▶ All checks passed
#   Workflow security · Dependencies                               ──▶ Smoke test ×3 ──▶ Screenshots ┘
#   Website
#
# Every run page tells the story: a pipeline diagram colored by result, test tables, and pictures
# of the real notch taken by the smoke test on each macOS (pushes to main keep them on ci-shots).
#
# Fast by design: the cheap Linux checks start everything, tests and packaging run side by side,
# macOS jobs are skipped when only the website changed, and a newer push cancels an older run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NSUnbufferedIO: "YES"

jobs:
  # ── Stage 1 · Checks (Linux, each well under a minute) ───────────────────
  changes:
    name: Checks (What changed)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      app: ${{ steps.diff.outputs.app }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide what to run
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Nothing to compare with, so everything runs."
            app=true; site=true; files="(everything)"
          else
            files=$(git diff --name-only "$base...$GITHUB_SHA")
            app=false; site=false
            grep -qE '^(Sources/|Tests/|Resources/|scripts/|Package\.swift|Makefile|\.github/workflows/ci\.yml)' <<<"$files" && app=true
            grep -qE '^(docs/|scripts/check-site\.py|\.github/workflows/ci\.yml)' <<<"$files" && site=true
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          {
            echo "### 🧭 What changed"
            echo
            echo "| Area | Runs |"
            echo "|---|---|"
            echo "| App (build, test, package, smoke) | $([ "$app" = true ] && echo '✅ yes' || echo '⏭️ skipped, no app changes') |"
            echo "| Website | $([ "$site" = true ] && echo '✅ yes' || echo '⏭️ skipped, no site changes') |"
            echo
            echo "<details><summary>Files</summary>"
            echo
            echo '```'
            echo "$files"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Checks (Lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Quick checks (the same ones the pre-commit hook runs)
        run: bash scripts/quick-checks.sh
      - name: Workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
      - name: Summary
        run: echo "### ✅ Lint passed" >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Checks (Secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS"
          curl -sSfLO "$base/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks
      - name: Scan the whole history for keys and tokens
        run: |
          ./gitleaks git . --redact --no-banner --report-format sarif --report-path gitleaks.sarif
          {
            echo "### 🔐 No secrets found"
            echo
            echo "gitleaks $GITLEAKS checked $(git rev-list --count HEAD) commits."
          } >> "$GITHUB_STEP_SUMMARY"

  workflows:
    name: Checks (Workflow security)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows (zizmor)
        env:
          # Lets zizmor look up actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.31.1 --format=github --min-severity=medium .github/workflows
          echo "### 🛡️ Workflows audited: no injection, credential or vulnerable action findings" >> "$GITHUB_STEP_SUMMARY"

  dependencies:
    name: Checks (Dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review new dependencies for known vulnerabilities and licenses
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Summary
        run: |
          {
            echo "### 📦 Dependencies"
            echo
            echo "Every action and package this change adds or bumps was checked against the GitHub Advisory Database."
            echo "Dependabot keeps the pinned actions current, and opens security fixes on its own."
          } >> "$GITHUB_STEP_SUMMARY"

  website:
    name: Checks (Website)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links, anchors, page weight and script sources
        run: python3 scripts/check-site.py docs

  # ── Stage 2 · Build and test on every macOS we support, package in parallel ──
  test:
    name: Test (${{ matrix.name }})
    needs: [changes, lint]
    if: needs.changes.outputs.app == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            os: macos-15
            coverage: true
          - name: macOS 26
            os: macos-26
          - name: macOS 27
            os: xcode-27      # GitHub's macOS 27 image (preview)
    env:
      MATRIX_NAME: ${{ matrix.name }}
      MATRIX_OS: ${{ matrix.os }}
      COVERAGE: ${{ matrix.coverage && 'yes' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the newest Xcode on this runner
        id: xcode
        run: ./scripts/select-xcode.sh

      - name: Describe the machine
        env:
          XCODE: ${{ steps.xcode.outputs.xcode }}
          SWIFT: ${{ steps.xcode.outputs.swift }}
        run: |
          {
            echo "### 🖥️ $MATRIX_NAME"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`$MATRIX_OS\`, $(uname -m) |"
            echo "| macOS | $(sw_vers -productVersion) |"
            echo "| Xcode | $XCODE |"
            echo "| Swift | $SWIFT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: build-${{ matrix.os }}-${{ steps.xcode.outputs.swift }}-${{ matrix.coverage && 'cov' || 'std' }}-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: build-${{ matrix.os }}-${{ steps.xcode.outputs.swift }}-${{ matrix.coverage && 'cov' || 'std' }}-

      - name: Build (warnings are errors)
        run: |
          flags=(); [ -n "$COVERAGE" ] && flags=(--enable-code-coverage)
          swift build --build-tests -Xswiftc -warnings-as-errors "${flags[@]}"

      - name: Test
        run: |
          flags=(); [ -n "$COVERAGE" ] && flags=(--enable-code-coverage)
          swift test --skip-build --parallel --xunit-output test-results.xml "${flags[@]}"

      - name: Test report
        if: always()
        run: |
          if [ -f test-results.xml ]; then
            python3 scripts/test-summary.py test-results.xml "$MATRIX_NAME"
          else
            echo "### ❌ $MATRIX_NAME: no test results (build failed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Coverage
        if: matrix.coverage
        run: python3 scripts/coverage-summary.py "$(swift test --show-codecov-path)" "($MATRIX_NAME)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results*.xml
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package (Apple silicon app)
    needs: [changes, lint]
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the newest Xcode
        run: ./scripts/select-xcode.sh
      - name: Build DMG and zip
        run: ./scripts/dist.sh
      - name: Describe the build
        id: meta
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/NotchBar.app/Contents/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "### 📦 NotchBar $VERSION (${GITHUB_SHA::7})"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---:|---|"
            for f in dist/*.dmg dist/*.zip; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(shasum -a 256 "$f" | cut -c1-16)…\` |"
            done
            echo
            echo "Architectures: $(lipo -archs dist/NotchBar.app/Contents/MacOS/NotchBar)"
            echo
            echo "Download it from the **Artifacts** section of this run to try this exact build."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NotchBar-${{ steps.meta.outputs.version }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14
      - name: Upload app bundle for the smoke test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-bundle
          path: dist/NotchBar-*.zip
          retention-days: 1

  # ── Stage 3 · Check the packaged app ────────────────────────────────────
  budget:
    name: Size budget
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      # The website promises a 2 MB download; leave room, but catch a real regression.
      MAX_ZIP_KB: 5120
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-bundle
          path: pkg
      - name: Download stays small
        run: |
          zip=$(ls pkg/NotchBar-*.zip)
          kb=$(( $(stat -c %s "$zip") / 1024 ))
          pct=$(( kb * 100 / MAX_ZIP_KB ))
          {
            echo "### ⚖️ Size budget"
            echo
            echo "| | Size | Budget | Used |"
            echo "|---|---:|---:|---:|"
            echo "| App download | $kb KB | $MAX_ZIP_KB KB | $pct% |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$kb" -gt "$MAX_ZIP_KB" ]; then
            echo "::error title=Size budget::The app is $kb KB, over the $MAX_ZIP_KB KB budget"
            exit 1
          fi
          echo "::notice title=Size budget::$kb KB of $MAX_ZIP_KB KB ($pct%)"

  smoke:
    name: Smoke test (${{ matrix.name }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15
            os: macos-15
          - name: macOS 26
            os: macos-26
          - name: macOS 27
            os: xcode-27      # GitHub's macOS 27 image (preview)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-bundle
          path: pkg
      - name: Unpack
        run: ditto -x -k pkg/NotchBar-*.zip pkg/
      - name: Install, launch, drive and quit the packaged app
        env:
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: ./scripts/smoke-test.sh pkg/NotchBar.app
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-${{ matrix.os }}
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Pictures of the real notch from each smoke test, right on the run page. Only pushes to main
  # save them (on the ci-shots branch, newest 40 runs), so this is the one job that can write.
  screenshots:
    name: Screenshots
    needs: [package, smoke]
    if: always() && needs.package.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # pictures are a nice extra, never a reason to fail CI
        with:
          pattern: shots-*
          path: shots
      - name: Save them and show them here
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if ! ls shots/*/*.png >/dev/null 2>&1; then
            echo "### 📸 No screenshots this run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir site && cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          url="https://github.com/$REPO.git"
          git checkout -q --orphan ci-shots
          if git -c http.extraheader="$auth" fetch -q --depth 1 "$url" ci-shots 2>/dev/null; then
            git checkout -q FETCH_HEAD -- .
          fi
          mkdir -p "runs/$RUN"
          for d in ../shots/shots-*; do
            os=${d##*/shots-}
            for f in "$d"/*.png; do cp "$f" "runs/$RUN/$os-$(basename "$f")"; done
          done
          if [ -d runs ]; then
            find runs -mindepth 1 -maxdepth 1 -type d | sort -V | head -n -40 | xargs -r rm -rf
          fi
          printf '# CI screenshots\n\nPictures of the notch from the smoke test, newest 40 runs. Rewritten on every push to main.\n' > README.md
          git add -A
          git commit -qm "Screenshots for run $RUN"
          # One commit, replaced every time, so this branch never grows.
          git -c http.extraheader="$auth" push -q --force "$url" ci-shots
          base="https://raw.githubusercontent.com/$REPO/ci-shots/runs/$RUN"
          oses=(macos-15 macos-26 xcode-27)
          {
            echo "### 📸 NotchBar on a real Mac"
            echo
            echo "Taken by the smoke test while it drove the packaged app."
            echo
            echo "| | macOS 15 | macOS 26 | macOS 27 |"
            echo "|---|:-:|:-:|:-:|"
            for state in "1-working:Working" "2-approval:Asking" "3-done:Done"; do
              row="| **${state#*:}** |"
              for os in "${oses[@]}"; do
                if [ -f "runs/$RUN/$os-${state%%:*}.png" ]; then
                  row+=" <img src=\"$base/$os-${state%%:*}.png\" width=\"300\" alt=\"${state#*:} on $os\"> |"
                else
                  row+=" n/a |"
                fi
              done
              echo "$row"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Gate ────────────────────────────────────────────────────────────────
  gate:
    name: All checks passed
    if: always()
    needs: [changes, lint, secrets, workflows, dependencies, website, test, package, budget, smoke, screenshots]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["RESULTS"])
          names = {
              "changes": "What changed", "lint": "Lint", "secrets": "Secrets", "workflows": "Workflow security",
              "dependencies": "Dependencies", "website": "Website", "test": "Test (macOS 15, 26, 27)",
              "package": "Package", "budget": "Size budget", "smoke": "Smoke test (macOS 15, 26, 27)",
              "screenshots": "Screenshots",
          }
          icon = {"success": "✅", "skipped": "⏭️", "failure": "❌", "cancelled": "🚫"}
          bad = [k for k, v in needs.items() if v["result"] not in ("success", "skipped")]
          def result(*keys):
              rs = [needs.get(k, {}).get("result", "skipped") for k in keys]
              for r in ("failure", "cancelled", "success"):
                  if r in rs:
                      return r
              return "skipped"
          checks = result("changes", "lint", "secrets", "workflows", "dependencies", "website")
          nodes = [("checks", "Checks ×6", checks), ("test", "Test ×3", result("test")),
                   ("package", "Package", result("package")), ("budget", "Size budget", result("budget")),
                   ("smoke", "Smoke test ×3", result("smoke")), ("shots", "Screenshots", result("screenshots")),
                   ("gate", "All checks passed", "failure" if bad else "success")]
          edges = ["checks --> test --> gate", "checks --> package --> budget --> gate",
                   "package --> smoke --> shots --> gate"]
          colors = {"success": "#1a7f37", "failure": "#cf222e", "cancelled": "#9a6700", "skipped": "#8c959f"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### 🗺️ Pipeline\n\n```mermaid\nflowchart LR\n")
              for key, label, r in nodes:
                  f.write(f'  {key}["{icon.get(r, "❔")} {label}"]:::{r}\n')
              for e in edges:
                  f.write(f"  {e}\n")
              for r, c in colors.items():
                  f.write(f"  classDef {r} fill:{c},stroke:{c},color:#ffffff\n")
              f.write("```\n\n")
              f.write("| Stage | Result |\n|---|---|\n")
              for k, label in names.items():
                  r = needs.get(k, {}).get("result", "skipped")
                  f.write(f"| {label} | {icon.get(r, '❔')} {r} |\n")
          if bad:
              print("A stage didn't pass: " + ", ".join(f"{names.get(k, k)} ({needs[k]['result']})" for k in bad))
              raise SystemExit(1)
          print("✅ Everything passed")
          PY
